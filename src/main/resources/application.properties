server.port=5001

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Pool de conexiones (ajustable por variable de entorno para el benchmark)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=30000

# Hilos de Tomcat (default 200)
server.tomcat.threads.max=${TOMCAT_THREADS:200}
